<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#b28dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#242b3d"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#0d1220"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <rect x="310" y="70" width="180" height="310" rx="20" fill="#151b2c" stroke="#2a3142" stroke-width="2.5"/>
  <rect x="326" y="100" width="148" height="250" rx="4" fill="#0d1220"/>
  <circle cx="400" cy="365" r="8" fill="none" stroke="#3a4358" stroke-width="2"/>

  <g stroke="#4c5567" stroke-width="4" stroke-linecap="round">
    <line x1="345" y1="140" x2="455" y2="140"/>
    <line x1="345" y1="160" x2="430" y2="160"/>
    <line x1="345" y1="200" x2="455" y2="200"/>
    <line x1="345" y1="220" x2="410" y2="220"/>
    <line x1="345" y1="260" x2="455" y2="260"/>
  </g>
  <rect x="338" y="190" width="124" height="24" rx="4" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <line x1="338" y1="150" x2="462" y2="150" stroke="url(#g)" stroke-width="2" opacity="0.8">
    <animate attributeName="y1" values="120;280;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="120;280;120" dur="3s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(560,150)">
    <rect x="-30" y="-22" width="60" height="44" rx="6" fill="#171d2b" stroke="url(#g)" stroke-width="2"/>
    <text x="0" y="8" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#8ff3e0" text-anchor="middle" font-weight="700">Aa</text>
  </g>
