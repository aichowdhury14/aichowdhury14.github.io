<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#b28dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#b28dff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b28dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="2.6" fill="#2b3348"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#0d1220"/>
  <rect x="230" y="90" width="330" height="270" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <circle cx="330" cy="190" r="7" fill="#fb7185"/>
  <circle cx="470" cy="290" r="7" fill="#fbbf24"/>

  <g transform="translate(430,230)">
    <circle r="80" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.35"/>
    <path d="M0 -80 A80 80 0 0 1 56 -57" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(560,150)">
    <circle r="46" fill="#171d2b" stroke="url(#g)" stroke-width="4" fill-opacity="0.5"/>
    <line x1="33" y1="33" x2="66" y2="66" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
